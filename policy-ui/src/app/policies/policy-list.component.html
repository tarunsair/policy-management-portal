<input
  type="text"
  placeholder="Search policy"
  [(ngModel)]="searchText"
  (ngModelChange)="onSearchChange()"
/>

<table class="policy-table">
  <thead>
    <tr>
      <th>Policy Number</th>
      <th>Customer Name</th>
      <th>Policy Type</th>
      <th>Premium</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let policy of filteredPolicies">
      <td>{{ policy.policyNumber }}</td>
      <td>{{ policy.customerName }}</td>
      <td>{{ policy.policyType }}</td>
      <td>{{ policy.premiumAmount }}</td>
      <td>{{ policy.status }}</td>
    </tr>
  </tbody>
</table>
<div *ngIf="loading">Loading policies...</div>

<div *ngIf="errorMessage">
  {{ errorMessage }}
</div>

<div *ngIf="!loading && filteredPolicies.length === 0">
  No policies found.
</div>
